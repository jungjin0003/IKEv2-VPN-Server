# IKEv2 VPN Server settings
# IKEV2_HOSTNAME        : external hostname (server ID); empty = certificate CN
# IKEV2_ENC             : cipher preference - "auto" (widest compatibility,
#                         several suites offered) | "aes256" | "aes128"
# IKEV2_AUTOBLOCK       : integrate with DSM auto block (Control Panel > Security >
#                         Protection) - register IKEv2 auth-failure IPs in the DSM
#                         auto-block list (registration only, DSM handles the rest)
IKEV2_HOSTNAME=""
IKEV2_ENC="auto"
IKEV2_AUTOBLOCK="no"
# IKEV2_IFACE : network interface the server listens on.
#               ""  = all interfaces (binds every real IPv4 address) - default
#               <name> (e.g. eth0) = only that interface's address
IKEV2_IFACE=""

# Each auth method is its own strongSwan conn with its own client IP pool
# and DNS, so they can be routed/firewalled independently.
#
# IKEV2_ENABLE_MSCHAPV2 : EAP-MSCHAPv2 (username/password) auth
# IKEV2_MSCHAPV2_AUTH   : "local" = package accounts,
#                         "dsm"   = active DSM accounts (NT hashes read from
#                                   synosmbpasswd.conf)
IKEV2_ENABLE_MSCHAPV2="no"
IKEV2_MSCHAPV2_AUTH="local"
IKEV2_SUBNET_MSCHAPV2="10.10.0.0/24"
IKEV2_DNS_MSCHAPV2="8.8.8.8"

# IKEV2_ENABLE_PSK : pre-shared key auth (IKEV2_PSK = shared secret)
IKEV2_ENABLE_PSK="no"
IKEV2_PSK=""
IKEV2_SUBNET_PSK="10.11.0.0/24"
IKEV2_DNS_PSK="8.8.8.8"

# IKEV2_ENABLE_RSA : client certificate (pubkey) auth
IKEV2_ENABLE_RSA="no"
IKEV2_SUBNET_RSA="10.12.0.0/24"
IKEV2_DNS_RSA="8.8.8.8"

# IKEV2_ENABLE_EAPTLS : EAP-TLS client certificate auth (needs eap-tls plugin)
IKEV2_ENABLE_EAPTLS="no"
IKEV2_SUBNET_EAPTLS="10.13.0.0/24"
IKEV2_DNS_EAPTLS="8.8.8.8"
